version: '3.8'

services:
  # Reverse proxy with HTTPS
  caddy:
    image: caddy:2.7-alpine
    container_name: legal-ai-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - EMAIL=${ACME_EMAIL:-admin@legal-ai.local}
    networks:
      - legal-ai-network
    depends_on:
      - api

  # Main API service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: legal-ai-api-prod
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://legal_ai:${DB_PASSWORD}@postgres:5432/legal_ai_db
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - OLLAMA_URL=http://ollama:11434
      - CORS_ORIGINS=${CORS_ORIGINS:-https://${DOMAIN:-localhost}}
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_REQUESTS_PER_MINUTE=60
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - ./data:/app/data
      - ./ml/checkpoints:/app/ml/checkpoints
      - ./configs:/app/configs
    depends_on:
      - postgres
      - redis
      - ollama
    networks:
      - legal-ai-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend application
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    container_name: legal-ai-web-prod
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://${DOMAIN:-localhost}/api
      - NEXT_PUBLIC_APP_VERSION=1.0.0-prod
    networks:
      - legal-ai-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: legal-ai-db-prod
    restart: unless-stopped
    environment:
      - POSTGRES_DB=legal_ai_db
      - POSTGRES_USER=legal_ai
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - legal-ai-network
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.max=10000
      -c pg_stat_statements.track=all
      -c log_statement=all
      -c log_min_duration_statement=1000
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_ai -d legal_ai_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: legal-ai-redis-prod
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - legal-ai-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LLM service
  ollama:
    image: ollama/ollama:latest
    container_name: legal-ai-ollama-prod
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=http://api:8000
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

  # Monitoring services
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: legal-ai-prometheus-prod
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - legal-ai-network
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:10.1.0
    container_name: legal-ai-grafana-prod
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=strict
      - GF_SERVER_ROOT_URL=https://${DOMAIN:-localhost}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    expose:
      - "3000"
    networks:
      - legal-ai-network
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true

  # Security scanning
  trivy:
    image: aquasec/trivy:latest
    container_name: legal-ai-security-scanner
    restart: "no"
    command: >
      sh -c "
        trivy image --exit-code 1 --severity HIGH,CRITICAL legal-ai-api-prod &&
        trivy image --exit-code 1 --severity HIGH,CRITICAL legal-ai-web-prod &&
        trivy fs --exit-code 1 --severity HIGH,CRITICAL /app
      "
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - .:/app:ro
      - trivy_cache:/root/.cache/trivy
    networks:
      - legal-ai-network
    profiles:
      - security-scan

  # Log aggregation
  loki:
    image: grafana/loki:2.9.0
    container_name: legal-ai-loki-prod
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    expose:
      - "3100"
    networks:
      - legal-ai-network
    security_opt:
      - no-new-privileges:true

  promtail:
    image: grafana/promtail:2.9.0
    container_name: legal-ai-promtail-prod
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - legal-ai-network
    depends_on:
      - loki
    security_opt:
      - no-new-privileges:true

# Persistent volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  trivy_cache:
    driver: local

# Networks
networks:
  legal-ai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16 