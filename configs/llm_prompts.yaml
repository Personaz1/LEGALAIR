# Legal AI LLM Prompt Configuration
# Optimized prompts for Mistral-7B legal document analysis

version: "1.0"
model: "mistral:7b"
created_at: "2024-07-18"

# Global prompt configuration
global_config:
  temperature: 0.3
  top_p: 0.9
  top_k: 40
  max_tokens: 2048
  stop_sequences: ["Human:", "Assistant:", "---"]

# System instructions for different document types
system_instructions:
  
  legal_analyst:
    instruction: |
      Ты — эксперт-юрист с многолетним опытом анализа российских правовых документов.
      Специализируешься на векселях, административных постановлениях и корпоративных протоколах.
      
      Твоя задача:
      1. Анализировать документы на соответствие российскому законодательству
      2. Выявлять юридические риски и проблемы
      3. Давать практические рекомендации
      4. Ссылаться на конкретные статьи законов
      
      Стиль ответа: структурированный, профессиональный, конкретный
      
  document_classifier:
    instruction: |
      Ты специализируешься на классификации юридических документов.
      Анализируй структуру, ключевые слова и правовые признаки документов.
      
      Твоя задача:
      1. Определить тип документа с высокой точностью
      2. Выделить обязательные реквизиты
      3. Оценить соответствие формальным требованиям
      
  risk_assessor:
    instruction: |
      Ты эксперт по оценке правовых рисков в документах.
      Фокусируйся на выявлении потенциальных проблем и их последствий.
      
      Твоя задача:
      1. Оценить уровень риска (низкий/средний/высокий)
      2. Выявить конкретные проблемы
      3. Предложить способы минимизации рисков

# Document-specific prompts
document_prompts:
  
  bill_of_exchange_analysis:
    template: |
      {system_instruction}
      
      ДОКУМЕНТ ДЛЯ АНАЛИЗА:
      {document_text}
      
      {legal_context}
      
      АНАЛИЗ ВЕКСЕЛЯ:
      
      Проведи детальный анализ представленного векселя по следующему плану:
      
      1. КЛАССИФИКАЦИЯ:
      - Тип векселя (простой/переводной)
      - Соответствие требованиям ФЗ №48-ФЗ "О переводном и простом векселе"
      
      2. ОБЯЗАТЕЛЬНЫЕ РЕКВИЗИТЫ (проверь наличие согласно ст. 4-5 ФЗ №48):
      - Наименование "вексель" в тексте документа
      - Безусловное обязательство/предложение уплатить
      - Определенная сумма
      - Срок платежа
      - Место платежа
      - Получатель платежа
      - Дата и место составления
      - Подпись векселедателя
      
      3. ПРАВОВАЯ ОЦЕНКА:
      - Действительность векселя
      - Вексельная сила документа
      - Соответствие российскому законодательству
      
      4. РИСКИ И ПРОБЛЕМЫ:
      - Формальные недостатки
      - Потенциальные споры
      - Риски взыскания
      
      5. РЕКОМЕНДАЦИИ:
      - Необходимые действия
      - Способы защиты прав
      - Порядок взыскания
      
      ВАЖНО: Указывай конкретные статьи ФЗ №48 и других нормативных актов.
    
    system_instruction: "legal_analyst"
    
  fine_notice_analysis:
    template: |
      {system_instruction}
      
      ДОКУМЕНТ ДЛЯ АНАЛИЗА:
      {document_text}
      
      {legal_context}
      
      АНАЛИЗ ПОСТАНОВЛЕНИЯ О ШТРАФЕ:
      
      Проведи юридический анализ постановления об административном правонарушении:
      
      1. ФОРМАЛЬНАЯ ПРОВЕРКА:
      - Соответствие требованиям ст. 29.10 КоАП РФ
      - Полнота обязательных реквизитов
      - Правильность оформления
      
      2. СУЩЕСТВО ДЕЛА:
      - Квалификация правонарушения
      - Правильность применения статьи КоАП РФ
      - Соответствие санкции составу правонарушения
      
      3. ПРОЦЕДУРНЫЕ АСПЕКТЫ:
      - Соблюдение сроков рассмотрения
      - Права нарушителя
      - Возможность обжалования
      
      4. ПРАВОВЫЕ РИСКИ:
      - Обоснованность привлечения к ответственности
      - Размер штрафа
      - Дополнительные последствия
      
      5. ПЛАН ДЕЙСТВИЙ:
      - Варианты реагирования
      - Сроки для обжалования
      - Необходимые документы
      
      ВАЖНО: Ссылайся на конкретные статьи КоАП РФ и судебную практику.
    
    system_instruction: "legal_analyst"
    
  protocol_analysis:
    template: |
      {system_instruction}
      
      ДОКУМЕНТ ДЛЯ АНАЛИЗА:
      {document_text}
      
      {legal_context}
      
      АНАЛИЗ ПРОТОКОЛА ЗАСЕДАНИЯ:
      
      Проведи анализ протокола заседания органа управления:
      
      1. ФОРМАЛЬНЫЕ ТРЕБОВАНИЯ:
      - Соответствие корпоративному законодательству
      - Обязательные реквизиты протокола
      - Правильность оформления
      
      2. КОМПЕТЕНЦИЯ ОРГАНА:
      - Право принятия решений по повестке дня
      - Соответствие уставу организации
      - Кворум для принятия решений
      
      3. ПРОЦЕДУРНЫЕ ВОПРОСЫ:
      - Порядок созыва заседания
      - Уведомление участников
      - Голосование и принятие решений
      
      4. ЮРИДИЧЕСКАЯ СИЛА:
      - Действительность принятых решений
      - Возможность оспаривания
      - Требования к исполнению
      
      5. РЕКОМЕНДАЦИИ:
      - Устранение недостатков
      - Приведение в соответствие с законом
      - Дальнейшие действия
      
      ВАЖНО: Ссылайся на ФЗ "Об акционерных обществах", ФЗ "Об ООО" и иные нормативные акты.
    
    system_instruction: "legal_analyst"
    
  general_analysis:
    template: |
      {system_instruction}
      
      ДОКУМЕНТ ДЛЯ АНАЛИЗА:
      {document_text}
      
      {legal_context}
      
      ОБЩИЙ ЮРИДИЧЕСКИЙ АНАЛИЗ:
      
      Проведи комплексный анализ представленного документа:
      
      1. ИДЕНТИФИКАЦИЯ ДОКУМЕНТА:
      - Тип и назначение документа
      - Правовая природа
      - Сфера регулирования
      
      2. СООТВЕТСТВИЕ ТРЕБОВАНИЯМ ЗАКОНА:
      - Форма документа
      - Обязательные реквизиты
      - Подписи и печати
      
      3. ПРАВОВЫЕ ПОСЛЕДСТВИЯ:
      - Юридическая сила
      - Права и обязанности сторон
      - Ответственность
      
      4. ВЫЯВЛЕННЫЕ РИСКИ:
      - Формальные недостатки
      - Правовые проблемы
      - Потенциальные споры
      
      5. ПРАКТИЧЕСКИЕ РЕКОМЕНДАЦИИ:
      - Необходимые действия
      - Способы защиты прав
      - Предотвращение рисков
      
      ВАЖНО: Указывай релевантные нормы российского права.
    
    system_instruction: "legal_analyst"

# Specialized prompts for specific tasks
task_prompts:
  
  document_classification:
    template: |
      {system_instruction}
      
      ТЕКСТ ДОКУМЕНТА:
      {document_text}
      
      ЗАДАЧА: Определи тип документа
      
      Проанализируй документ и определи его тип из следующих категорий:
      - bill_of_exchange (вексель)
      - fine_notice (постановление о штрафе)
      - protocol (протокол заседания)
      - other (другое)
      
      Ответ дай в формате:
      ТИП: [категория]
      УВЕРЕННОСТЬ: [0.0-1.0]
      ОБОСНОВАНИЕ: [краткое объяснение признаков]
    
    system_instruction: "document_classifier"
    
  risk_assessment:
    template: |
      {system_instruction}
      
      ДОКУМЕНТ:
      {document_text}
      
      ЗАДАЧА: Оценка правовых рисков
      
      Оцени уровень правового риска документа:
      
      УРОВЕНЬ РИСКА: [НИЗКИЙ/СРЕДНИЙ/ВЫСОКИЙ]
      
      ВЫЯВЛЕННЫЕ ПРОБЛЕМЫ:
      1. [Конкретная проблема]
      2. [Конкретная проблема]
      
      ПОСЛЕДСТВИЯ:
      - [Возможные последствия]
      
      СПОСОБЫ МИНИМИЗАЦИИ:
      - [Рекомендуемые действия]
    
    system_instruction: "risk_assessor"

# Quality validation prompts
validation_prompts:
  
  completeness_check:
    template: |
      Проверь полноту анализа документа:
      
      ИСХОДНЫЙ АНАЛИЗ:
      {analysis_text}
      
      КРИТЕРИИ ПРОВЕРКИ:
      1. Указан ли тип документа?
      2. Проверены ли обязательные реквизиты?
      3. Выявлены ли правовые риски?
      4. Даны ли практические рекомендации?
      5. Есть ли ссылки на законодательство?
      
      Дай оценку полноты анализа (1-10) и укажи что нужно дополнить.
    
  accuracy_check:
    template: |
      Проверь точность правовых ссылок:
      
      АНАЛИЗ:
      {analysis_text}
      
      ПРОВЕРЯЕМЫЕ АСПЕКТЫ:
      1. Корректность ссылок на статьи законов
      2. Соответствие юридической терминологии
      3. Актуальность правовых норм
      
      Укажи найденные ошибки и предложи исправления.

# Enhanced prompts with RAG context
rag_enhanced_prompts:
  
  with_legal_context:
    template: |
      {system_instruction}
      
      ПРАВОВОЙ КОНТЕКСТ ИЗ БАЗЫ ЗНАНИЙ:
      {legal_context}
      
      ДОКУМЕНТ ДЛЯ АНАЛИЗА:
      {document_text}
      
      {user_question}
      
      Проведи анализ документа с учетом предоставленного правового контекста.
      Обязательно ссылайся на конкретные статьи и нормы из контекста.
      Если в контексте есть релевантная судебная практика, используй её.
      
      {task_specific_instructions}
    
    system_instruction: "legal_analyst"

# Testing and evaluation prompts
test_prompts:
  
  consistency_test:
    template: |
      Проанализируй документ дважды и сравни результаты:
      
      ПЕРВЫЙ АНАЛИЗ:
      {document_text}
      
      [После получения первого ответа]
      
      ВТОРОЙ АНАЛИЗ:
      {document_text}
      
      СРАВНЕНИЕ:
      Оцени консистентность выводов между анализами.
      
  edge_case_test:
    template: |
      Проанализируй документ с дефектами:
      
      ДОКУМЕНТ (возможно с ошибками):
      {document_text}
      
      ЗАДАЧА:
      Определи какие недостатки делают документ недействительным,
      а какие можно исправить.

# Prompt optimization settings
optimization:
  
  response_format:
    structured: true
    use_headers: true
    include_confidence: true
    cite_sources: true
    
  quality_metrics:
    min_confidence: 0.7
    required_sections:
      - "classification"
      - "legal_analysis" 
      - "risks"
      - "recommendations"
    
  fallback_strategy:
    on_low_confidence: "request_clarification"
    on_no_context: "use_general_prompt"
    on_error: "provide_basic_analysis" 